<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; connect-src *; script-src 'self' 'unsafe-inline' data: blob:; worker-src 'self' data: blob:; style-src 'self' 'unsafe-inline';" />
    <title>RecruitAssist Audio Companion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #17181a;
        --border: #23262b;
        --text: #e6e7ea;
        --muted: #8a8d94;
        --accent: #5b8def;
        --danger: #ef5b5b;
        --success: #3ddc84;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
      body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
      .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      label { color: var(--muted); font-size: 11px; display: block; margin-bottom: 4px; }
      input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; width: 100%; }
      button { background: var(--accent); color: white; border: 0; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.secondary { background: var(--surface); border: 1px solid var(--border); }
      button.danger { background: var(--danger); }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); }
      .dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
      .dot.err { background: var(--danger); }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
      .levels { display: flex; gap: 6px; margin-top: 8px; }
      .level { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; position: relative; }
      .level > .bar { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(to right, var(--success), var(--accent)); width: 0%; transition: width 100ms linear; }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 6px; }
      .stat-grid b { color: var(--text); font-weight: 500; }
      footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: auto; }
      .user-card { display: flex; align-items: center; gap: 10px; }
      .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
      .user-card .name { font-size: 13px; font-weight: 500; }
      .user-card .email { font-size: 11px; color: var(--muted); }
      .err-msg { color: var(--danger); font-size: 12px; margin-top: 6px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <img src="./logo.png" alt="Joules to Watts" style="max-width: 160px; height: auto; display: block; margin: 0 auto 8px" />
      <h1 style="text-align: center">RecruitAssist Audio Companion</h1>
      <div class="sub" style="text-align: center">Captures mic + system audio during assigned candidate calls.</div>
    </div>

    <!-- Login screen -->
    <div id="loginView" class="card" hidden>
      <form id="loginForm">
        <label>Work email</label>
        <input id="loginEmail" type="email" placeholder="you@company.com" autocomplete="username" required />
        <div style="height: 6px"></div>
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
        <div style="height: 10px"></div>
        <button id="loginBtn" type="submit">Sign in</button>
        <div id="loginError" class="err-msg" hidden></div>
        <div style="height: 10px"></div>
        <label>Backend</label>
        <div id="loginBackend" class="sub" style="margin: 0; word-break: break-all">loading…</div>
      </form>
    </div>

    <!-- Signed-in view -->
    <div id="appView" hidden>
      <div class="card">
        <div class="user-card">
          <span id="userAvatar" class="avatar">?</span>
          <div style="flex: 1">
            <div id="userName" class="name">—</div>
            <div id="userEmail" class="email">—</div>
          </div>
          <button id="signOutBtn" class="secondary" style="padding: 4px 8px; font-size: 11px">Sign out</button>
        </div>
        <div style="margin-top: 10px">
          <label>Microphone device</label>
          <select id="micDevice"></select>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <button id="startBtn">Start call (manual)</button>
          <button id="stopBtn" class="danger" disabled>Stop call</button>
        </div>
        <div class="status" style="margin-top: 10px">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">waiting for assignment…</span>
        </div>
        <div class="levels">
          <div class="level"><div id="agentLevel" class="bar"></div></div>
          <div class="level"><div id="customerLevel" class="bar"></div></div>
        </div>
        <div class="stat-grid">
          <div>Agent: <b id="agentKb">0 KB</b></div>
          <div>Customer: <b id="customerKb">0 KB</b></div>
          <div>Call ID: <b id="callId">—</b></div>
          <div>Duration: <b id="duration">0s</b></div>
        </div>
      </div>

      <div class="card">
        <label>Backend</label>
        <div id="backend" class="sub" style="margin: 0">loading…</div>
      </div>
    </div>

    <footer>RecruitAssist · Companion v0</footer>

    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
