<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Assist</title>
    <link rel="icon" href="data:," />
    <script>
      // Apply the saved theme before any CSS loads, so users never see a flash
      // of the wrong theme. Default is light.
      (function () {
        try {
          var t = localStorage.getItem('ia-theme');
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
