services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recruitassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruitassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitassist_dev}
      POSTGRES_DB: ${POSTGRES_DB:-recruitassist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitassist} -d ${POSTGRES_DB:-recruitassist}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=256MB
      -c work_mem=32MB
      -c max_wal_size=2GB

  redis:
    image: redis:7-alpine
    container_name: recruitassist-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
