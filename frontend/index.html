<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Assist</title>
    <link rel="icon" href="data:," />
    <!--
      Bricolage Grotesque — characterful display face for the brand and headings.
      Schibsted Grotesk — crisp, slightly warm grotesque for the dense live UI.
      Spline Sans Mono — timestamps, scores and other tabular/technical bits.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Schibsted+Grotesk:wght@400..700&family=Spline+Sans+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before any CSS loads, so users never see a flash
      // of the wrong theme. Default is light.
      (function () {
        try {
          var t = localStorage.getItem('ia-theme');
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
